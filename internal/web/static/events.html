<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>事件 · EDP Console</title>
  <link rel="icon" href="/stats/app-icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/stats/app-icon.png" />
  <script>
    (function () {
      var t = localStorage.getItem("edp_theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.classList.add("theme-" + t);
    })();
  </script>
  <link rel="stylesheet" href="/stats/css/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topnav" id="app-nav"></header>
    <main class="main">
      <div class="page-head">
        <div>
          <h1>拉取事件</h1>
          <div class="sub">最近失败与原始事件流 · 从看板独立出来便于排查</div>
        </div>
        <div class="toolbar">
          <label class="sr-only" for="limit">条数</label>
          <select id="limit" class="input" aria-label="条数">
            <option value="30">30 条</option>
            <option value="50" selected>50 条</option>
            <option value="100">100 条</option>
          </select>
          <button type="button" class="btn btn-primary" id="btn-refresh">刷新</button>
        </div>
      </div>
      <div id="load-error" class="error-banner" role="alert" hidden></div>

      <div class="dim-tabs" role="tablist" aria-label="事件类型">
        <button type="button" class="active" id="tab-errors" role="tab" aria-selected="true" aria-controls="panel-errors" tabindex="0" data-tab="errors">最近失败</button>
        <button type="button" id="tab-events" role="tab" aria-selected="false" aria-controls="panel-events" tabindex="-1" data-tab="events">全部事件</button>
      </div>

      <section class="glass panel" id="panel-errors" role="tabpanel" aria-labelledby="tab-errors">
        <div class="panel-head"><h2>最近失败</h2></div>
        <div class="table-wrap" id="errors" aria-live="polite"></div>
      </section>

      <section class="glass panel" id="panel-events" role="tabpanel" aria-labelledby="tab-events" hidden style="margin-top:1rem">
        <div class="panel-head"><h2>最近事件（含成功）</h2></div>
        <div class="table-wrap" id="events" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <script src="/stats/js/app.js"></script>
  <script>
    if (!EDP.requireAuth()) throw new Error("auth");
    EDP.renderNav("events");

    function table(headers, rows) {
      if (!rows) return '<p class="empty">暂无数据</p>';
      return `<table class="data"><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
    }

    function evRows(items) {
      return (items || []).map(e => {
        const href = e.repository
          ? `/stats/image.html?registry=${encodeURIComponent(e.registry)}&repository=${encodeURIComponent(e.repository)}`
          : "";
        return `<tr ${href ? `class="clickable" data-href="${href}"` : ""}>
          <td>${EDP.fmtTime(e.ts)}</td>
          <td class="mono" title="上游 name">${EDP.esc(e.registry)}</td>
          <td class="mono" title="剥离路径前缀后的 repository">${EDP.esc(e.repository)}${e.reference ? ":" + EDP.esc(e.reference) : ""}</td>
          <td><span class="badge badge-info">${EDP.esc(e.event_type || "—")}</span></td>
          <td><span class="badge ${e.status >= 400 ? "badge-err" : "badge-ok"}">${e.status || "—"}</span></td>
          <td class="mono">${EDP.esc(e.client_ip)}</td>
		  <td class="mono">${EDP.esc(e.pull_user || "—")}</td>
          <td>${EDP.formatBytes(e.bytes || 0)}</td>
          <td class="mono">${EDP.esc(e.error || "")}</td>
          <td>${href ? `<a href="${href}">镜像</a>` : "—"}</td>
        </tr>`;
      }).join("");
    }

    function bindRows() {
      document.querySelectorAll("tr.clickable[data-href]").forEach(tr => {
        tr.addEventListener("click", (ev) => {
          if (ev.target.tagName === "A") return;
          location.href = tr.getAttribute("data-href");
        });
      });
    }

    let loadGeneration = 0;
    async function load() {
      const generation = ++loadGeneration;
      const err = document.getElementById("load-error");
      const refresh = document.getElementById("btn-refresh");
      err.hidden = true;
      refresh.disabled = true;
      document.getElementById("errors").innerHTML = '<p class="loading">正在加载事件…</p>';
      document.getElementById("events").innerHTML = '<p class="loading">正在加载事件…</p>';
      const limit = document.getElementById("limit").value;
      try {
        const [errors, events] = await Promise.all([
          EDP.api("/api/v1/errors?limit=" + encodeURIComponent(limit)),
          EDP.api("/api/v1/events?limit=" + encodeURIComponent(limit)),
        ]);
        if (generation !== loadGeneration) return;
        const headers = ["Time", "上游", "Repo", "Type", "Status", "IP", "拉取账号", "Bytes", "Error", ""];
        document.getElementById("errors").innerHTML = table(headers, evRows(errors.items));
        document.getElementById("events").innerHTML = table(headers, evRows(events.items));
        bindRows();
      } catch (e) {
        if (generation !== loadGeneration) return;
        err.hidden = false;
        err.textContent = e.message;
        document.getElementById("errors").innerHTML = '<p class="empty">事件加载失败</p>';
        document.getElementById("events").innerHTML = '<p class="empty">事件加载失败</p>';
      } finally {
        if (generation === loadGeneration) refresh.disabled = false;
      }
    }

    EDP.wireTabs(".dim-tabs", (btn) => {
      const tab = btn.dataset.tab;
      document.getElementById("panel-errors").hidden = tab !== "errors";
      document.getElementById("panel-events").hidden = tab !== "events";
    });
    document.getElementById("btn-refresh").addEventListener("click", load);
    document.getElementById("limit").addEventListener("change", load);
    load();
  </script>
</body>
</html>
