<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>分析看板 · EDP Console</title>
  <link rel="icon" href="/stats/favicon.svg" type="image/svg+xml" />
  <script>
    // Prevent theme flash before CSS
    (function () {
      var t = localStorage.getItem("edp_theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.classList.add("theme-" + t);
    })();
  </script>
  <link rel="stylesheet" href="/stats/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topnav" id="app-nav"></header>
    <main class="main">
      <div class="page-head">
        <div>
          <h1>分析看板</h1>
          <div class="sub">多维度拉取统计 · 流量 · 错误率 · 客户端（明细事件见「事件」页）</div>
        </div>
        <div class="toolbar">
          <label class="sr-only" for="range">时间范围</label>
          <select id="range" class="input" aria-label="时间范围">
            <option value="1d">近 1 日</option>
            <option value="7d" selected>近 7 日</option>
            <option value="14d">近 14 日</option>
            <option value="30d">近 30 日</option>
          </select>
          <button type="button" class="btn btn-primary" id="btn-refresh">刷新</button>
        </div>
      </div>
      <div id="load-error" class="error-banner" hidden></div>

      <div class="dim-tabs" role="tablist" aria-label="分析维度">
        <button type="button" class="active" data-dim="overview">总览</button>
        <button type="button" data-dim="registry">Registry</button>
        <button type="button" data-dim="repos">热门镜像</button>
        <button type="button" data-dim="clients">客户端</button>
      </div>

      <section class="kpi-grid" id="kpis">
        <div class="glass kpi"><div class="label">今日 Pulls</div><div class="value" id="k-today-pulls">—</div></div>
        <div class="glass kpi"><div class="label">今日流量</div><div class="value" id="k-today-bytes">—</div></div>
        <div class="glass kpi"><div class="label">区间 Pulls</div><div class="value" id="k-range-pulls">—</div><div class="hint" id="k-range-hint"></div></div>
        <div class="glass kpi"><div class="label">区间流量</div><div class="value" id="k-range-bytes">—</div></div>
        <div class="glass kpi"><div class="label">错误率</div><div class="value" id="k-err-rate">—</div><div class="hint" id="k-err-hint"></div></div>
        <div class="glass kpi"><div class="label">活跃客户端</div><div class="value" id="k-clients">—</div></div>
      </section>

      <div class="row">
        <section class="glass panel">
          <div class="panel-head"><h2>趋势 · Pulls / 流量</h2></div>
          <div class="chart-wrap"><canvas id="chart-ts" aria-label="趋势图"></canvas></div>
        </section>
        <section class="glass panel">
          <div class="panel-head"><h2>Registry 占比 (Pulls)</h2></div>
          <div class="chart-wrap"><canvas id="chart-reg" aria-label="Registry 占比"></canvas></div>
        </section>
      </div>

      <div class="row">
        <section class="glass panel">
          <div class="panel-head"><h2>流量 vs 错误（双轴）</h2></div>
          <div class="chart-wrap"><canvas id="chart-err" aria-label="错误趋势"></canvas></div>
        </section>
        <section class="glass panel">
          <div class="panel-head"><h2>Registry 流量</h2></div>
          <div class="chart-wrap"><canvas id="chart-reg-bytes" aria-label="Registry 流量"></canvas></div>
        </section>
      </div>

      <div class="row">
        <section class="glass panel">
          <div class="panel-head">
            <h2>热门镜像</h2>
            <a class="btn btn-ghost" href="/stats/images.html" style="min-height:36px;font-size:0.8rem">全部镜像 →</a>
          </div>
          <div class="table-wrap" id="top-repos"></div>
        </section>
        <section class="glass panel">
          <div class="panel-head">
            <h2>活跃客户端</h2>
            <a class="btn btn-ghost" href="/stats/events.html" style="min-height:36px;font-size:0.8rem">查看事件 →</a>
          </div>
          <div class="table-wrap" id="top-clients"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="/stats/js/app.js"></script>
  <script>
    if (!EDP.requireAuth()) throw new Error("auth");
    EDP.renderNav("dashboard");

    let charts = {};
    const C = () => EDP.chartColors();

    function destroyChart(key) {
      if (charts[key]) { charts[key].destroy(); delete charts[key]; }
    }

    function table(headers, rows) {
      if (!rows) return '<p class="empty">暂无数据</p>';
      return `<table class="data"><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
    }

    function updateTS(points) {
      if (typeof Chart === "undefined") return;
      const c = C();
      destroyChart("ts");
      charts.ts = new Chart(document.getElementById("chart-ts"), {
        type: "line",
        data: {
          labels: points.map(p => p.day.slice(5)),
          datasets: [
            { label: "Pulls", data: points.map(p => p.pulls), borderColor: c.blue, backgroundColor: c.blueFill, fill: true, tension: 0.3, yAxisID: "y" },
            { label: "Bytes", data: points.map(p => p.bytes_total), borderColor: c.violet, backgroundColor: c.violetFill, fill: true, tension: 0.3, yAxisID: "y1" },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { labels: { color: c.legend } } },
          scales: {
            x: { ticks: { color: c.tick }, grid: { color: c.grid } },
            y: { ticks: { color: c.tick }, grid: { color: c.grid } },
            y1: { position: "right", ticks: { color: c.tick, callback: v => EDP.formatBytes(v) }, grid: { drawOnChartArea: false } },
          },
        },
      });
    }

    function updateErr(points) {
      if (typeof Chart === "undefined") return;
      const c = C();
      destroyChart("err");
      charts.err = new Chart(document.getElementById("chart-err"), {
        type: "bar",
        data: {
          labels: points.map(p => p.day.slice(5)),
          datasets: [
            { type: "line", label: "Pulls", data: points.map(p => p.pulls), borderColor: c.blue, tension: 0.3, yAxisID: "y" },
            { type: "bar", label: "Errors", data: points.map(p => p.errors), backgroundColor: c.red + "99", yAxisID: "y1" },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: c.legend } } },
          scales: {
            x: { ticks: { color: c.tick }, grid: { color: c.grid } },
            y: { ticks: { color: c.tick }, grid: { color: c.grid } },
            y1: { position: "right", ticks: { color: c.tick }, grid: { drawOnChartArea: false } },
          },
        },
      });
    }

    function doughnut(id, key, labels, data) {
      if (typeof Chart === "undefined") return;
      const c = C();
      destroyChart(key);
      charts[key] = new Chart(document.getElementById(id), {
        type: "doughnut",
        data: {
          labels: labels.length ? labels : ["无数据"],
          datasets: [{ data: data.length ? data : [1], backgroundColor: labels.length ? labels.map((_, i) => c.palette[i % c.palette.length]) : ["#94a3b8"] }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: "bottom", labels: { color: c.legend, boxWidth: 12 } } },
        },
      });
    }

    let lastPts = [];
    let lastBy = [];

    async function refresh() {
      const range = document.getElementById("range").value;
      const errEl = document.getElementById("load-error");
      errEl.hidden = true;
      try {
        const [summary, ts, repos, clients] = await Promise.all([
          EDP.api("/api/v1/summary?range=" + encodeURIComponent(range)),
          EDP.api("/api/v1/timeseries?range=" + encodeURIComponent(range)),
          EDP.api("/api/v1/top/repos?limit=12&range=" + encodeURIComponent(range)),
          EDP.api("/api/v1/top/clients?limit=12&range=" + encodeURIComponent(range)),
        ]);
        document.getElementById("k-today-pulls").textContent = summary.today_pulls ?? 0;
        document.getElementById("k-today-bytes").textContent = EDP.formatBytes(summary.today_bytes);
        document.getElementById("k-range-pulls").textContent = summary.range_pulls ?? 0;
        document.getElementById("k-range-hint").textContent = `${summary.from_day || ""} → ${summary.to_day || ""}`;
        document.getElementById("k-range-bytes").textContent = EDP.formatBytes(summary.range_bytes);
        document.getElementById("k-err-rate").textContent = EDP.formatPct(summary.error_rate);
        document.getElementById("k-err-hint").textContent = "errors " + (summary.range_errors ?? 0);
        document.getElementById("k-clients").textContent = summary.active_clients ?? 0;

        lastPts = ts.points || [];
        lastBy = summary.by_registry || [];
        updateTS(lastPts);
        updateErr(lastPts);
        doughnut("chart-reg", "reg", lastBy.map(r => r.registry), lastBy.map(r => r.pulls));
        doughnut("chart-reg-bytes", "regb", lastBy.map(r => r.registry), lastBy.map(r => r.bytes_total));

        document.getElementById("top-repos").innerHTML = table(
          ["Registry", "Repository", "Pulls", "Bytes", "Errors", ""],
          (repos.items || []).map(r => `<tr class="clickable" data-href="/stats/image.html?registry=${encodeURIComponent(r.registry)}&repository=${encodeURIComponent(r.repository)}">
            <td class="mono">${EDP.esc(r.registry)}</td>
            <td class="mono">${EDP.esc(r.repository)}</td>
            <td>${r.pulls}</td><td>${EDP.formatBytes(r.bytes_total)}</td><td>${r.errors}</td>
            <td><a href="/stats/image.html?registry=${encodeURIComponent(r.registry)}&repository=${encodeURIComponent(r.repository)}">详情</a></td>
          </tr>`).join("")
        );
        document.getElementById("top-clients").innerHTML = table(
          ["Client IP", "Pulls", "Bytes"],
          (clients.items || []).map(c => `<tr><td class="mono">${EDP.esc(c.client_ip)}</td><td>${c.pulls}</td><td>${EDP.formatBytes(c.bytes_total)}</td></tr>`).join("")
        );

        document.querySelectorAll("tr.clickable[data-href]").forEach(tr => {
          tr.addEventListener("click", (ev) => {
            if (ev.target.tagName === "A") return;
            location.href = tr.getAttribute("data-href");
          });
        });
      } catch (e) {
        errEl.hidden = false;
        errEl.textContent = "加载失败: " + e.message;
      }
    }

    document.getElementById("btn-refresh").addEventListener("click", refresh);
    document.getElementById("range").addEventListener("change", refresh);
    document.querySelectorAll(".dim-tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".dim-tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const map = { overview: "kpis", registry: "chart-reg", repos: "top-repos", clients: "top-clients" };
        const id = map[btn.dataset.dim];
        const el = id && (document.getElementById(id)?.closest(".panel") || document.getElementById(id));
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
    window.addEventListener("edp-theme-change", () => {
      if (!lastPts.length) return;
      updateTS(lastPts);
      updateErr(lastPts);
      doughnut("chart-reg", "reg", lastBy.map(r => r.registry), lastBy.map(r => r.pulls));
      doughnut("chart-reg-bytes", "regb", lastBy.map(r => r.registry), lastBy.map(r => r.bytes_total));
    });
    window.addEventListener("load", refresh);
  </script>
</body>
</html>
