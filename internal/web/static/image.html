<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>镜像详情 · EDP Console</title>
  <link rel="icon" href="/stats/favicon.svg" type="image/svg+xml" />
  <script>
    (function () {
      var t = localStorage.getItem("edp_theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.classList.add("theme-" + t);
    })();
  </script>
  <link rel="stylesheet" href="/stats/css/app.css" />
  <script src="/stats/js/chart.umd.min.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topnav" id="app-nav"></header>
    <main class="main">
      <div class="page-head">
        <div>
          <h1 id="title">镜像详情</h1>
          <div class="sub" id="subtitle">—</div>
        </div>
        <div class="toolbar">
          <a class="btn btn-ghost" href="/stats/images.html">← 镜像列表</a>
          <a class="btn btn-primary" href="/stats/index.html">分析看板</a>
          <select id="range" class="input" aria-label="时间范围">
            <option value="7d" selected>近 7 日</option>
            <option value="14d">近 14 日</option>
            <option value="30d">近 30 日</option>
          </select>
        </div>
      </div>
      <div id="load-error" class="error-banner" role="alert" hidden></div>

      <section class="glass panel" id="analysis">
        <div class="panel-head"><h2>拉取趋势（本镜像）</h2></div>
        <div class="chart-wrap"><canvas id="chart" aria-label="镜像趋势"></canvas></div><p class="chart-summary" id="chart-summary" role="status"></p>
      </section>

      <section class="glass panel" style="margin-top:1rem">
        <div class="panel-head"><h2>Tag / Digest 列表</h2></div>
        <div class="table-wrap" id="tags" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <script src="/stats/js/app.js"></script>
  <script>
    if (!EDP.requireAuth()) throw new Error("auth");
    EDP.renderNav("images");

    const params = new URLSearchParams(location.search);
    const registry = params.get("registry") || "";
    const repository = params.get("repository") || "";
    document.getElementById("title").textContent = repository || "镜像详情";
    document.getElementById("subtitle").textContent = registry ? `${registry} / ${repository}` : "缺少参数";

    let chart;
    let loadGeneration = 0;
    async function load() {
      const generation = ++loadGeneration;
      const err = document.getElementById("load-error");
      const tagsEl = document.getElementById("tags");
      err.hidden = true;
      if (!registry || !repository) {
        err.hidden = false;
        err.textContent = "缺少 registry 或 repository 参数";
        return;
      }
      const range = document.getElementById("range").value;
      tagsEl.setAttribute("aria-busy", "true");
      tagsEl.innerHTML = '<p class="loading">正在加载 tag…</p>';
      try {
        const [tags, ts] = await Promise.all([
          EDP.api(`/api/v1/images/tags?registry=${encodeURIComponent(registry)}&repository=${encodeURIComponent(repository)}`),
          EDP.api(`/api/v1/images/timeseries?registry=${encodeURIComponent(registry)}&repository=${encodeURIComponent(repository)}&range=${encodeURIComponent(range)}`),
        ]);
        if (generation !== loadGeneration) return;
        const rows = (tags.items || []).map(t => `<tr>
          <td class="mono">${EDP.esc(t.reference || "(empty)")}</td>
          <td>${t.pulls}</td>
          <td>${EDP.formatBytes(t.bytes_total)}</td>
          <td>${t.errors}</td>
          <td>${EDP.fmtTime(t.last_pull_ts)}</td>
          <td>${EDP.fmtTime(t.first_pull_ts)}</td>
        </tr>`).join("");
        document.getElementById("tags").innerHTML = rows
          ? `<table class="data"><thead><tr>
              <th>Tag / Digest</th><th>Pulls</th><th>Bytes</th><th>Errors</th><th>最近</th><th>首次</th>
            </tr></thead><tbody>${rows}</tbody></table>`
          : '<p class="empty">暂无 tag 记录</p>';

        if (typeof Chart !== "undefined") {
          const c = EDP.chartColors();
          const pts = ts.points || [];
          if (chart) chart.destroy();
          chart = new Chart(document.getElementById("chart"), {
            type: "line",
            data: {
              labels: pts.map(p => p.day.slice(5)),
              datasets: [
                { label: "Pulls", data: pts.map(p => p.pulls), borderColor: c.blue, backgroundColor: c.blueFill, fill: true, tension: 0.3 },
                { label: "Errors", data: pts.map(p => p.errors), borderColor: c.red, tension: 0.3 },
              ],
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { labels: { color: c.legend } } },
              scales: {
                x: { ticks: { color: c.tick }, grid: { color: c.grid } },
                y: { ticks: { color: c.tick }, grid: { color: c.grid } },
              },
            },
          });
        }
        const totalPulls = (ts.points || []).reduce((n, p) => n + (Number(p.pulls) || 0), 0);
        const totalBytes = (ts.points || []).reduce((n, p) => n + (Number(p.bytes_total) || 0), 0);
        document.getElementById("chart-summary").textContent = `区间合计：Pulls ${totalPulls}，流量 ${EDP.formatBytes(totalBytes)}`;
        if (location.hash === "#analysis") {
          document.getElementById("analysis").scrollIntoView({ behavior: "smooth" });
        }
      } catch (e) {
        if (generation !== loadGeneration) return;
        err.hidden = false;
        err.textContent = e.message;
        tagsEl.innerHTML = '<p class="empty">镜像详情加载失败</p>';
      } finally {
        if (generation === loadGeneration) tagsEl.setAttribute("aria-busy", "false");
      }
    }
    document.getElementById("range").addEventListener("change", load);
    window.addEventListener("load", load);
  </script>
</body>
</html>
