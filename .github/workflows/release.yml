name: Release source package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  source-zip:
    name: Build and attach source .zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Package source (tracked files only)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          name="easy-docker-proxy-${TAG}"
          mkdir -p dist
          # git archive packs only tracked files: no .env, config.yaml, data/ or .git
          git archive --format=zip --prefix="${name}/" -o "dist/${name}-source.zip" HEAD
          (cd dist && sha256sum "${name}-source.zip" > "${name}-source.zip.sha256")
          ls -lh dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
