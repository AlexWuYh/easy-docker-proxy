name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  source-zip:
    name: Build and attach source .zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Package source (tracked files only)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          name="easy-docker-proxy-${TAG}"
          mkdir -p dist
          # git archive packs only tracked files: no .env, config.yaml, data/ or .git
          git archive --format=zip --prefix="${name}/" -o "dist/${name}-source.zip" HEAD
          (cd dist && sha256sum "${name}-source.zip" > "${name}-source.zip.sha256")
          ls -lh dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  docker-image:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase repository path
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.release.tag_name }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
