# Production-oriented compose: proxy (+ optional Caddy edge).
# Usage (from repo root — .env lives at repo root, not under deploy/):
#   cp .env.example .env && edit PROXY_ADMIN_TOKEN / PROXY_WEB_PASSWORD
#   cp configs/config.docker.yaml configs/config.yaml
#   docker compose --env-file .env -f deploy/docker-compose.yaml up -d      # pulls the GHCR image
#   (add --build to build from local source instead)
#
# Why --env-file .env:
#   Compose defaults project dir to the compose file's directory (deploy/),
#   so it would look for deploy/.env. Pass root .env explicitly for ${VAR} interpolation.
#
# Ports:
#   - Data plane published on host 127.0.0.1:${PROXY_PORT:-5000} (for an existing host edge)
#   - Admin/stats NOT published by default
#   - Prefer reverse-proxy with your existing Caddy → host :5000 (see deploy/README.md)
#   - Optional edge profile only if you have no edge yet (standard 80/443)
#
# Security: no docker.sock; non-root image; read_only rootfs

services:
  proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Published by .github/workflows/release.yml. Override with PROXY_IMAGE in .env
    # (e.g. a version tag); `up --build` builds from source and tags it with this name.
    image: ${PROXY_IMAGE:-ghcr.io/alexwuyh/easy-docker-proxy:latest}
    restart: unless-stopped
    environment:
      PROXY_ADMIN_TOKEN: ${PROXY_ADMIN_TOKEN:?set PROXY_ADMIN_TOKEN in .env}
      PROXY_WEB_USER: ${PROXY_WEB_USER:-admin}
      PROXY_WEB_PASSWORD: ${PROXY_WEB_PASSWORD:-}
      PROXY_PULL_USER: ${PROXY_PULL_USER:-puller}
      PROXY_PULL_PASSWORD: ${PROXY_PULL_PASSWORD:-}
      DOCKERHUB_USER: ${DOCKERHUB_USER:-}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN:-}
      GITHUB_USER: ${GITHUB_USER:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      QUAY_USER: ${QUAY_USER:-}
      QUAY_TOKEN: ${QUAY_TOKEN:-}
      GCR_USER: ${GCR_USER:-}
      GCR_TOKEN: ${GCR_TOKEN:-}
      NVCR_USER: ${NVCR_USER:-}
      NVCR_TOKEN: ${NVCR_TOKEN:-}
      ELASTIC_USER: ${ELASTIC_USER:-}
      ELASTIC_TOKEN: ${ELASTIC_TOKEN:-}
      PROXY_CADDY_IP: ${PROXY_CADDY_IP:-172.30.0.3}
      PROXY_DOMAIN: ${PROXY_DOMAIN:-reg.example.com}
    volumes:
      - ../configs/config.yaml:/etc/proxy/config.yaml:ro
      - proxy-data:/data
    ports:
      # Registry data plane — loopback only; publish publicly through a TLS edge.
      - "127.0.0.1:${PROXY_PORT:-5000}:5000"
      # Optional local-only stats (uncomment):
      # - "127.0.0.1:5001:5001"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      proxy-net:
        ipv4_address: ${PROXY_IP:-172.30.0.2}
    # Intentionally NO docker.sock mount.

  # Optional TLS edge (profile: edge). Requires host 80/443 to be available.
  caddy:
    profiles: ["edge"]
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    environment:
      # Site address in deploy/Caddyfile ({$PROXY_DOMAIN}); set in root .env.
      PROXY_DOMAIN: ${PROXY_DOMAIN:-reg.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      proxy-net:
        ipv4_address: ${PROXY_CADDY_IP:-172.30.0.3}
    depends_on:
      - proxy

volumes:
  proxy-data:
  caddy-data:
  caddy-config:

networks:
  proxy-net:
    driver: bridge
    ipam:
      config:
        # Change PROXY_SUBNET only together with the two static service IPs
        # and configs/config.docker.yaml trusted_proxies.
        - subnet: ${PROXY_SUBNET:-172.30.0.0/29}
          gateway: ${PROXY_GATEWAY:-172.30.0.1}
